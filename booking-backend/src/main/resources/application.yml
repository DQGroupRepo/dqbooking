spring:
  application:
    name: booking-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/Catalog}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.booking: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.security: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [correlationId=%X{correlationId:-}] [userId=%X{userId:-} role=%X{role:-} vendorId=%X{vendorId:-}] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
  upload:
    path: ${APP_UPLOAD_PATH:/tmp/uploads}
    base-url: ${APP_UPLOAD_BASE_URL:http://localhost:8080/uploads}
    image-max-size-mb: ${APP_IMAGE_MAX_SIZE_MB:5}
    video-max-size-mb: ${APP_VIDEO_MAX_SIZE_MB:50}
